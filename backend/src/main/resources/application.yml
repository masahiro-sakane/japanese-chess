spring:
  application:
    name: japanese-chess-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/japanese_chess
    username: chess_user
    password: chess_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

eventstore:
  connection-string: esdb://localhost:2113?tls=false

server:
  port: 8080

logging:
  level:
    com.japanesechess: DEBUG
    org.hibernate.SQL: DEBUG

version: '3.8'

services:
  eventstore:
    image: eventstore/eventstore:23.10.0-bookworm-slim
    container_name: japanese-chess-eventstore
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_EXT_TCP_PORT=1113
      - EVENTSTORE_HTTP_PORT=2113
      - EVENTSTORE_INSECURE=true
      - EVENTSTORE_ENABLE_EXTERNAL_TCP=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    ports:
      - "1113:1113"
      - "2113:2113"
    volumes:
      - eventstore-data:/var/lib/eventstore
      - eventstore-logs:/var/log/eventstore
    networks:
      - japanese-chess-network

  postgres:
    image: postgres:16-alpine
    container_name: japanese-chess-postgres
    environment:
      - POSTGRES_DB=japanese_chess
      - POSTGRES_USER=chess_user
      - POSTGRES_PASSWORD=chess_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - japanese-chess-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d japanese_chess"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eventstore-data:
  eventstore-logs:
  postgres-data:

networks:
  japanese-chess-network:
    driver: bridge
